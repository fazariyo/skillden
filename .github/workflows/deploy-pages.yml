# Builds the site as a static export and publishes it to GitHub Pages on every push to main.
# Settings > Pages > Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare source for static export
        run: node scripts/prepare-pages.mjs

      - name: Build
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APPLICATION_ENDPOINT: ${{ vars.NEXT_PUBLIC_APPLICATION_ENDPOINT }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
